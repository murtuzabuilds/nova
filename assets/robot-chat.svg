  <path d="M54 150h39c2 0 3 1.5 3 3.5s-1.5 4.5-4 4.5H55c-2.5 0-4-2-4-4.5s1-3.5 3-3.5z" fill="url(#sole)"/>
  <path d="M54 150h39c1.5 0 2.5.8 2.8 2H51.2c.3-1.2 1.3-2 2.8-2z" fill="#B9CAF5"/>
  <ellipse cx="39" cy="120" rx="10.5" ry="10.5" fill="url(#wb)"/>
  <circle cx="32" cy="119.5" r="2" fill="#E0483F"/><circle cx="32" cy="119.5" r="2.8" fill="none" stroke="#1C2130" stroke-width=".8"/>
  <path d="M33 128c3-2 10-2 13 0l1 10-14 1z" fill="url(#d)"/>
  <path d="M30 136c4-2 11-2 15 0l1 9H29z" fill="url(#w)"/>
  <path d="M19 153c0-7 5-12 12-12h9c8 0 13 5 14 12z" fill="url(#w)"/>
  <path d="M30 141h14l1 5c-5 2-11 2-16 0z" fill="#1A1E2A"/>
  <path d="M17 152h39c2 0 3 1.5 3 3.5s-1.5 4.5-4 4.5H18c-2.5 0-4-2-4-4.5s1-3.5 3-3.5z" fill="url(#sole)"/>
  <path d="M17 152h39c1.5 0 2.5.8 2.8 2H14.2c.3-1.2 1.3-2 2.8-2z" fill="#B9CAF5"/>

