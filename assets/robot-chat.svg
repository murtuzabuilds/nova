<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 164" role="img" aria-label="Nova robot">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#EEF2FA"/><stop offset="1" stop-color="#C4CEE4"/></linearGradient>
    <linearGradient id="ws" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C4DC"/><stop offset=".35" stop-color="#F4F7FC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <radialGradient id="wb" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".65" stop-color="#E6EBF6"/><stop offset="1" stop-color="#AEB9D3"/></radialGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3442"/><stop offset="1" stop-color="#0B0D13"/></linearGradient>
    <linearGradient id="vis" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232B3B"/><stop offset=".45" stop-color="#090B11"/><stop offset="1" stop-color="#05060A"/></linearGradient>
    <radialGradient id="ear" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#3A4254"/><stop offset=".55" stop-color="#11141C"/><stop offset="1" stop-color="#05060A"/></radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FE4FF"/><stop offset=".5" stop-color="#22B4FF"/><stop offset="1" stop-color="#1A7DFF"/></linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FA8E6"/><stop offset="1" stop-color="#4C68B8"/></linearGradient>
