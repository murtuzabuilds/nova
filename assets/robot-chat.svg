  <path d="M31 4h43c13 0 20 8 20 22v14c0 15-8 24-22 24H40C24 64 14 55 14 39V26C14 12 20 4 31 4z" fill="url(#w)"/>
  <path d="M31 4c-11 0-17 8-17 22v13c0 16 10 25 26 25h4C36 58 34 44 35 30c1-12 4-21 9-26z" fill="url(#ws)"/>
  <path d="M44 4c-5 5-8 14-9 26-1 14 1 28 9 34" fill="none" stroke="#AAB6D2" stroke-width=".8"/>
  <path d="M40 14c14-3 36-3 50 2" fill="none" stroke="#C4CEE4" stroke-width=".8"/>
  <path d="M34 8c12-3 30-3 42-1" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
  <path d="M14 39c0 16 10 25 26 25h32c14 0 22-9 22-24v-6c-2 14-10 21-24 21H42C28 55 17 50 14 39z" fill="#8E9CC0" opacity=".38"/>
