  <path d="M33 71c8-4 34-4 42 0 3 2 4 6 3 10l-4 17c-1 4-4 6-8 6H45c-4 0-7-2-8-6l-5-17c-1-4 0-8 1-10z" fill="url(#w)"/>
  <path d="M33 71c8-4 34-4 42 0 2 1 3 3 3.5 5-12-3-34-3-46 0 0-2 .2-4 .5-5z" fill="#7F8DB3" opacity=".45"/>
  <path d="M38 74c3 8 9 14 14 26" fill="none" stroke="#AAB6D2" stroke-width=".7"/>
  <rect x="56" y="83" width="15.5" height="7.5" rx="1.8" fill="#12151D"/>
  <rect x="58" y="84.8" width="5" height="4" rx="1" fill="#C9D3E6"/><rect x="64.5" y="84.8" width="5" height="4" rx="1" fill="#C9D3E6"/>
  <path d="M48 64h17l2 7H46z" fill="url(#d)"/>

  <!-- near arm (viewer's left) -->
  <ellipse cx="35.5" cy="84" rx="7" ry="11.5" fill="url(#ear)" transform="rotate(-8 35.5 84)"/>
  <path d="M19 78c3-5 10-6 14-2l2 6-9 7-7-4z" fill="url(#wb)"/>
  <path d="M10 91c2-5 8-7 13-5l5 3-2 22c0 3-3 5-6 5h-8c-3 0-5-2-5-5z" fill="url(#ws)"/>
  <path d="M12 100c2-1 4-1 5 1m-6 5c2-1 5-1 7 1" fill="none" stroke="#35A9FF" stroke-width=".9" stroke-linecap="round"/>
  <path d="M7 114h17l1 9c0 2-1 3-3 3H9c-2 0-3-1-3-3z" fill="url(#w)"/>
  <path d="M8 125l3 12 3 1-1-9 3 10 3 1-1-10 3 9 3-1-1-13zM24 114c4 2 7 7 8 13l1 9-3 2-3-10-2 1z" fill="url(#d)"/>

