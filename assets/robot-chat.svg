  <path d="M82 86l6 1 3 8-6 2z" fill="url(#d)"/>
  <path d="M84 91c4-3 10-2 13 2l5 13c1 3-1 6-4 7l-5 1c-3 0-5-2-6-5z" fill="url(#wb)"/>
  <circle cx="92" cy="101" r="1.7" fill="#1C2130"/><circle cx="92" cy="101" r=".7" fill="#35A9FF"/>
  <path d="M92 112c3-2 8-2 11 1l3 9c1 4-1 9-4 12l-3 1 1-6-3 7-3-1 2-7-4 5-2-2 3-8z" fill="url(#d)"/>

