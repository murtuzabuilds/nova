  <ellipse cx="23" cy="36" rx="10.5" ry="17" fill="#22B4FF" filter="url(#glow)" opacity=".7"/>
  <ellipse cx="23" cy="36" rx="10" ry="16.5" fill="#1FA8FF"/>
  <ellipse cx="23.5" cy="36" rx="8.2" ry="14.5" fill="url(#ear)"/>
  <ellipse cx="24" cy="36" rx="5" ry="9.5" fill="none" stroke="#3B4458" stroke-width=".9"/>
  <ellipse cx="21" cy="29" rx="1.8" ry="3.5" fill="#FFFFFF" opacity=".35"/>
  <!-- visor and eyes -->
  <rect x="42.6" y="18.6" width="49.8" height="37.8" rx="12.4" fill="#D3DBEC"/>
  <rect x="44" y="20" width="47" height="35" rx="11" fill="url(#vis)"/>
  <path d="M50 23h34c3 0 5 2 5 5-12-3-30-3-43 1 0-3 2-6 4-6z" fill="#FFFFFF" opacity=".08"/>
  <g filter="url(#glow)" opacity=".9"><ellipse cx="58" cy="35" rx="4" ry="8.5" fill="#22B4FF"/><ellipse cx="80" cy="35" rx="4" ry="8.5" fill="#22B4FF"/></g>
  <ellipse cx="58" cy="35" rx="3.3" ry="7.8" fill="none" stroke="url(#eye)" stroke-width="2.2"/>
  <ellipse cx="80" cy="35" rx="3.3" ry="7.8" fill="none" stroke="url(#eye)" stroke-width="2.2"/>
  <ellipse cx="58" cy="35" rx="1.2" ry="5" fill="#0B63D6" opacity=".55"/><ellipse cx="80" cy="35" rx="1.2" ry="5" fill="#0B63D6" opacity=".55"/>
